<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>법과권리 중간고사 문제집</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 시험지(A3 박스형) 감각 — 상단 도구줄, 가운데 한 문제 카드, 아래 번호판. 오답 노트는 별도 탭. 채점 표시는 인주색. */
:root{
  --bg:#f3f4f7; --paper:#ffffff; --ink:#18212e; --muted:#5d6676; --line:#d9dee6; --soft:#eef1f5;
  --accent:#1d5a86; --accent-soft:#e4edf5; --stamp:#c0362c; --stamp-soft:#fbeceb;
  --ok:#2c7a4b; --ok-soft:#e5f3ea; --note:#8a6a12; --note-soft:#fbf4e1;
  --f-display:"Nanum Myeongjo","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161d; --paper:#1a1f28; --ink:#e4e8ef; --muted:#9aa3b2; --line:#2e3542; --soft:#222834;
  --accent:#7db3dc; --accent-soft:#1d2a38; --stamp:#f0776c; --stamp-soft:#3a1f1d;
  --ok:#6cc790; --ok-soft:#183024; --note:#e2c06a; --note-soft:#332b17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --paper:#1a1f28; --ink:#e4e8ef; --muted:#9aa3b2; --line:#2e3542; --soft:#222834;
  --accent:#7db3dc; --accent-soft:#1d2a38; --stamp:#f0776c; --stamp-soft:#3a1f1d;
  --ok:#6cc790; --ok-soft:#183024; --note:#e2c06a; --note-soft:#332b17; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:860px;margin:0 auto;padding-block:32px 80px}
h1{font-family:var(--f-display);font-size:clamp(26px,4.4vw,36px);margin:0;line-height:1.25;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;font-size:14px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--ink);margin:22px 0 14px}
.tab{background:none;border:none;padding:8px 14px;font-weight:600;color:var(--muted);border-radius:6px 6px 0 0}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tab .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--stamp);color:var(--paper);font-size:12px;line-height:18px;text-align:center;font-variant-numeric:tabular-nums}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.spacer{flex:1}
.sync{font-size:12.5px;color:var(--muted)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 24px 20px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.qno{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--ink);font-variant-numeric:tabular-nums}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 7px;line-height:1.7}
.hot{color:var(--stamp);border:1.5px solid var(--stamp);border-radius:4px;padding:0 6px;font-weight:700;font-size:11.5px;transform:rotate(-2deg);display:inline-block}
.prev-wrong{color:var(--note);background:var(--note-soft);border-radius:4px;padding:0 7px;font-weight:600}

.sit{border:1.5px solid var(--ink);border-radius:2px;padding:14px 16px;margin:6px 0 14px;background:var(--paper)}
.sit .lab{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:4px}
.sit p{margin:4px 0}
.treebox{overflow-x:auto;margin:10px 0 2px}
.treebox svg{display:block;margin:0 auto;max-width:none}
.tl{stroke:var(--ink);stroke-width:1.5;fill:none}
.tl.dash{stroke-dasharray:4 4;stroke:var(--muted)}
.tn rect{fill:var(--paper);stroke:var(--ink);stroke-width:1.5}
.tn.k rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2}
.tn.d rect{fill:var(--soft);stroke:var(--muted);stroke-dasharray:3 3}
.tn.u rect{fill:var(--paper);stroke:var(--muted);stroke-dasharray:2 3}
.tn text{fill:var(--ink);font-size:12.5px;font-family:var(--f-body);font-weight:600}
.tn.d text{fill:var(--muted)}
.tml{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);justify-content:center;margin-top:4px}

.stem{font-weight:600;margin:4px 0 12px;text-wrap:pretty}
.stem small{font-weight:400;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:start;text-align:left;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--ink);line-height:1.55}
.opt .k{font-family:var(--f-display);font-weight:800;font-size:17px;text-align:center;line-height:1.35;border-radius:50%;}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .k{color:var(--accent)}
.opt .mk{font-size:12px;font-weight:700;white-space:nowrap}
.opt.g-ok{border-color:var(--ok)}
.opt.g-miss{border-color:var(--stamp);background:var(--stamp-soft)}
.opt.g-ok .mk{color:var(--ok)} .opt.g-miss .mk{color:var(--stamp)}
.opt:disabled{cursor:default}

.short{display:flex;gap:8px;flex-wrap:wrap}
.short input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;align-items:center}
.btn{border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:8px;padding:8px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}

.result{margin-top:16px;border-radius:10px;padding:14px 16px;border:1.5px solid}
.result.ok{border-color:var(--ok);background:var(--ok-soft)}
.result.no{border-color:var(--stamp);background:var(--stamp-soft)}
.result .verdict{font-weight:700;font-size:16px}
.result.ok .verdict{color:var(--ok)} .result.no .verdict{color:var(--stamp)}
.exp{margin-top:6px}
.exp ul{margin:4px 0;padding-left:18px}
.exp li{margin:2px 0}

.grid{display:flex;flex-wrap:wrap;gap:5px;margin-top:16px}
.dot{width:34px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding:0}
.dot.cur{border:2px solid var(--ink);color:var(--ink);font-weight:700}
.dot.s-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.dot.s-no{background:var(--stamp-soft);color:var(--stamp);border-color:var(--stamp)}
.score{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}

/* 오답 노트 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat .n{font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.stat .l{font-size:12px;color:var(--muted)}
.bar{height:4px;background:var(--soft);border-radius:2px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.nitem{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--stamp);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.nitem.done{border-left-color:var(--ok);opacity:.85}
.nitem .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);align-items:center}
.nitem .meta b{color:var(--stamp)}
.nitem .q{font-weight:600;margin:6px 0}
.nitem details{margin:4px 0}
.nitem summary{cursor:pointer;color:var(--accent);font-size:13.5px}
.cmp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14px;margin:6px 0}
.cmp dt{color:var(--muted)} .cmp dd{margin:0}
.cmp .mine{color:var(--stamp);font-weight:600} .cmp .right{color:var(--ok);font-weight:600}
textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--soft);color:var(--ink);resize:vertical;min-height:48px}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:4px}
/* 모의고사 */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.wide .wrap{max-width:1180px}
.mstart{display:grid;gap:14px}
.rules{margin:6px 0 0;padding-left:20px}
.rules li{margin:3px 0}
.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist th,.hist td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.hist th{color:var(--muted);font-weight:600;font-size:12.5px}
.exbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--ink);color:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.exbar .clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:21px;letter-spacing:.02em;padding:0 8px;border-radius:6px}
.exbar .clock.low{background:var(--stamp);color:var(--paper)}
.exbar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.exbar .btn.ghost{background:transparent;color:var(--bg);border-color:var(--muted)}
.exbar .grow{flex:1}
.confirm{flex-basis:100%;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--muted);padding-top:8px}
.omr{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 14px}
.omr button{width:32px;height:28px;font-size:12px;border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:4px;padding:0;font-variant-numeric:tabular-nums}
.omr button.on{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.sheet{background:var(--paper);border:1.5px solid var(--ink);padding:22px 24px}
.shead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 20px;align-items:end;border-bottom:3px double var(--ink);padding-bottom:10px;margin-bottom:6px}
.shead h2{font-family:var(--f-display);font-size:clamp(19px,2.6vw,24px);margin:0}
.shead .meta{font-size:13px;color:var(--muted)}
.cols{column-count:2;column-gap:36px;column-rule:1px solid var(--line)}
.sec{column-span:all;font-family:var(--f-display);font-size:17px;border-bottom:1.5px solid var(--ink);padding-bottom:4px;margin:18px 0 14px}
.item{break-inside:avoid;margin-bottom:24px;scroll-margin-top:96px}
.item .ino{font-weight:700;margin-bottom:4px}
.item .ino small{font-weight:400;color:var(--muted)}
.st{list-style:none;padding:0;margin:6px 0}
.st li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px;margin:3px 0}
.st li b{font-family:var(--f-display)}
.bubs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.bubs .lab{font-size:12.5px;color:var(--muted);margin-right:4px}
.bub{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:16px;padding:0}
.bub[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.item input{width:100%;box-sizing:border-box;font:inherit;padding:8px 10px;border:none;border-bottom:1.5px solid var(--ink);background:var(--soft);color:var(--ink);margin-top:6px}
.scorebox{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:baseline}
.scorebig{font-family:var(--f-display);font-size:clamp(46px,9vw,64px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.scorebig small{font-size:.4em;color:var(--muted)}
.rv{border-top:1px solid var(--line);padding:14px 0}
.rv .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ox{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.ox.o{color:var(--ok)} .ox.x{color:var(--stamp)}
.mk-ok{color:var(--ok);font-size:12px;font-weight:700;white-space:nowrap}
.mk-no{color:var(--stamp);font-size:12px;font-weight:700;white-space:nowrap}
@media (max-width:900px){.cols{column-count:1}.sheet{padding:18px 16px}}
@media (max-width:560px){.card{padding:18px 16px}.opt{grid-template-columns:26px minmax(0,1fr)}.opt .mk{grid-column:2}}
@media (prefers-reduced-motion:no-preference){.result{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>
<p style="max-width:860px;margin:16px auto 0;font-size:13px"><a href="./" style="color:var(--accent)">← 처음으로</a></p>


<div class="wrap">
  <header>
    <h1>법과권리 중간고사 문제집</h1>
    <p class="sub">세트 A 59문항 · 세트 B 54문항(전부 새 문제) · 실전 모의고사 40점 — 박스형은 옳은 것을 모두 골라야 정답(부분점수 없음)</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-quiz" aria-selected="true">문제 풀기</button>
    <button class="tab" role="tab" id="tab-mock" aria-selected="false">모의고사</button>
    <button class="tab" role="tab" id="tab-note" aria-selected="false">오답 노트<span class="cnt" id="noteCnt">0</span></button>
  </div>

  <section id="view-quiz">
    <div class="tools" id="setChips"></div>
    <div class="tools" id="partChips"></div>
    <div class="tools">
      <button class="chip" id="onlyWrong" aria-pressed="false">미해결 오답만</button>
      <button class="chip" id="shuffle" aria-pressed="false">순서 섞기</button>
      <span class="spacer"></span>
      <span class="score" id="score"></span>
    </div>
    <div id="qcard"></div>
    <div class="grid" id="grid" aria-label="문항 번호"></div>
  </section>

  <section id="view-mock" hidden></section>

  <section id="view-note" hidden>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <button class="chip" data-nf="open" aria-pressed="true">미해결</button>
      <button class="chip" data-nf="done" aria-pressed="false">해결함</button>
      <button class="chip" data-nf="all" aria-pressed="false">전체</button>
      <span class="spacer"></span>
      <button class="btn" id="retryWrong">미해결 오답 다시 풀기</button>
    </div>
    <div id="noteList"></div>
  </section>
  <p class="sync" id="sync">기록 저장소 확인 중…</p>
</div>

<script>
/* ---------- 가계도 ---------- */
function tree(t){
  var X=98,Y=80,W=78,H=30,P=14,ns={},mx=0,my=0,s='';
  t.n.forEach(function(n){ns[n[0]]={x:n[1],y:n[2],lab:n[3],f:n[4]||''};mx=Math.max(mx,n[1]);my=Math.max(my,n[2]);});
  function cx(n){return P+W/2+n.x*X} function cy(n){return P+18+H/2+n.y*Y}
  (t.m||[]).forEach(function(m){var A=ns[m[0]],B=ns[m[1]];if(cx(A)>cx(B)){var z=A;A=B;B=z}
    var x1=cx(A)+W/2,x2=cx(B)-W/2,y=cy(A);
    s+='<line class="tl'+(m[2]?' dash':'')+'" x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'"/>';
    if(m[3])s+='<text class="tml" x="'+((x1+x2)/2)+'" y="'+(y-6)+'" text-anchor="middle">'+m[3]+'</text>';});
  (t.c||[]).forEach(function(c){var ps=c[0].map(function(p){return ns[p]}),C=ns[c[1]],sx,sy;
    if(ps.length===2){sx=(cx(ps[0])+cx(ps[1]))/2;sy=cy(ps[0]);}else{sx=cx(ps[0]);sy=cy(ps[0])+H/2;}
    var top=cy(C)-H/2,ym=top-(Y-H)/2;
    s+='<path class="tl'+(c[2]?' dash':'')+'" d="M'+sx+' '+sy+' V'+ym+' H'+cx(C)+' V'+top+'"/>';
    if(c[3])s+='<text class="tml" x="'+(cx(C)+6)+'" y="'+(ym+13)+'">'+c[3]+'</text>';});
  Object.keys(ns).forEach(function(k){var n=ns[k];
    s+='<g class="tn '+n.f+'"><rect x="'+(cx(n)-W/2)+'" y="'+(cy(n)-H/2)+'" width="'+W+'" height="'+H+'" rx="5"/><text x="'+cx(n)+'" y="'+(cy(n)+4.5)+'" text-anchor="middle">'+n.lab+'</text></g>';});
  var w=P*2+W+mx*X,h=P*2+18+H+my*Y;
  return '<div class="treebox"><svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="가계도">'+s+'</svg></div>'+
   '<div class="legend"><span>파란 칸: 피상속인</span><span>점선 칸: 사망</span><span>점선 연결: 이혼·사실혼·단절</span></div>';
}

/* ---------- 문항 ---------- */
var K=['ㄱ','ㄴ','ㄷ','ㄹ','ㅁ'];
var STEM='옳은 것을 있는 대로 고르시오.';
var Q=[
/* 친족 */
{id:'k1',p:'친족',t:'b',hot:1,stem:'친족의 범위와 소멸에 대한 설명으로 '+STEM,
 o:['민법상 친족은 8촌 이내의 혈족, 4촌 이내의 인척, 배우자이다.','배우자는 1촌 친족이다.','혈족의 배우자의 혈족(사돈)은 현행 민법상 인척에 해당한다.','이혼하면 인척 관계는 즉시 소멸한다.','배우자가 사망하면 그 즉시 배우자 측과의 인척 관계가 소멸한다.'],a:[0,3],
 e:'<ul><li>ㄴ 배우자는 <b>0촌</b>.</li><li>ㄷ 사돈은 개정으로 인척에서 빠져 현행법상 남이다(결혼도 가능).</li><li>ㅁ 배우자 사망 시 인척 관계는 <b>유지</b>되고, <b>재혼하면</b> 소멸한다.</li></ul>'},

{id:'bc2',p:'범죄·수사',t:'b',stem:'명예훼손과 직장 내 성희롱에 대한 설명으로 '+STEM,

{id:'bc3',p:'범죄·수사',t:'b',stem:'수사의 시작과 출석에 대한 설명으로 '+STEM,

{id:'bc4',p:'범죄·수사',t:'b',stem:'체포·구속에 대한 설명으로 '+STEM,

{id:'bc5',p:'범죄·수사',t:'b',stem:'조사와 기소에 대한 설명으로 '+STEM,

{id:'bc6',p:'범죄·수사',t:'b',

{id:'bc7',p:'범죄·수사',t:'s',stem:'내사(입건 전 조사) 단계에서 혐의를 받는 사람을 부르는 말은?',acc:['용의자'],show:'용의자',e:'<b>용의자</b> → (입건) 피의자 → (기소) 피고인 → (확정) 수형자.'},
{id:'bc8',p:'범죄·수사',t:'s',stem:'체포 후 조사할 수 있는 최대 시간은 몇 시간인가? (숫자만)',acc:['48'],show:'48시간',e:'<b>48시간</b>. 더 구금하려면 그 안에 구속영장 청구.'},
{id:'bc9',p:'범죄·수사',t:'s',stem:'친고죄의 대표적인 예로, 피해자가 고소해야만 처벌할 수 있는 범죄는?',acc:['모욕죄','모욕'],show:'모욕죄',e:'<b>모욕죄</b>. 범인을 안 날부터 6개월 내 고소, 취소하면 재고소 불가.'},

{id:'bp5',p:'형벌',t:'s',hot:1,stem:'징역과 금고를 구분하는 기준으로, 징역형에만 부과되는 작업을 무엇이라 하는가?',acc:['정역','정역복무'],show:'정역',e:'<b>정역</b>(작업) 복무 여부. 금고는 과실범·정치범에게 주로 선고.'},

{id:'bp8',p:'형벌',t:'s',hot:1,stem:'벌금형의 전과 조회 기간은 부과된 때부터 몇 년인가? (숫자만)',acc:['2'],show:'2년',e:'벌금 <b>2년</b>, 3년 이하 징역·금고 5년, 3년 초과 10년.'},

   '<div class="confirm" id="mConfirm" hidden></div></div>';

  h+='<div class="sheet"><div class="shead"><h2>2026학년도 2학기 법과권리 중간고사 (모의)</h2><div class="meta">'+setName(M.set)+' · 박스형 '+nb+'문항 × '+PTS.b+'점 · 단답형 '+ns+'문항 × '+PTS.s+'점 · 총 '+total+'점'+(M.limit>0?' · 제한 '+M.limit+'분':'')+'</div></div><div class="cols">';
  var no=0;
  h+='<h3 class="sec">Ⅰ. 박스형 — 옳은 것을 있는 대로 고르시오 (각 '+PTS.b+'점, 부분점수 없음)</h3>';
  M.qs.forEach(function(id){var q=byId(id);if(q.t!=='b')return;no++;var pk=M.ans[id]||[];
    h+='<div class="item" id="mi-'+id+'"><div class="ino">'+no+'. <small>['+q.p+'] '+PTS.b+'점</small></div>'+sitHtml(q)+'<div class="stem">'+q.stem.replace(' '+STEM,'')+' '+STEM+'</div>'+
      '<ol class="st">'+q.o.map(function(o,i){return '<li><b>'+K[i]+'.</b><span>'+esc(o)+'</span><span></span></li>'}).join('')+'</ol>'+
      '<div class="bubs"><span class="lab">답</span>'+K.map(function(k,i){return '<button class="bub" data-mo="'+id+'|'+i+'" aria-pressed="'+(pk.indexOf(i)>=0)+'" aria-label="'+no+'번 '+k+'">'+k+'</button>'}).join('')+'</div></div>';});
  h+='<h3 class="sec">Ⅱ. 단답형 — 알맞은 단어 또는 수치를 쓰시오 (각 '+PTS.s+'점)</h3>';
  M.qs.forEach(function(id){var q=byId(id);if(q.t!=='s')return;no++;
    h+='<div class="item" id="mi-'+id+'"><div class="ino">'+no+'. <small>['+q.p+'] '+PTS.s+'점</small></div>'+sitHtml(q)+'<div class="stem">'+q.stem+'</div>'+
      '<label class="sr" for="ms-'+id+'" hidden>'+no+'번 답</label><input id="ms-'+id+'" data-ms="'+id+'" type="text" autocomplete="off" placeholder="답 :" value="'+esc(M.ans[id]||'')+'"></div>';});
  h+='</div></div><div class="actions"><span class="spacer"></span><button class="btn" data-m="ask">답안 제출</button></div>';
  return h;
}
function showConfirm(){var c=document.getElementById('mConfirm');if(!c)return;var left=M.qs.length-M.qs.filter(mAnswered).length;
  c.innerHTML='<span>'+(left?'응답하지 않은 문항이 <b>'+left+'개</b> 있어요. 제출하면 0점 처리됩니다.':'모든 문항에 답했어요. 제출할까요?')+'</span><span class="grow"></span><button class="btn ghost" data-m="cancel">계속 풀기</button><button class="btn" data-m="submit">제출하고 채점</button>';
  c.hidden=false;}
function isRight(q,a){if(q.t==='b'){return q.a.slice().sort().join()===(a||[]).slice().sort().join()}var v=norm(a||'');return !!v&&q.acc.some(function(x){return norm(x)===v})}
function submitMock(auto){if(M.phase!=='exam')return;clearInterval(mTimer);
  var now=Date.now(),per={},sc=0,bo=0,so=0,nb=0,ns=0;
  M.qs.forEach(function(id){var q=byId(id),a=M.ans[id],ok=isRight(q,a);per[id]=ok?1:0;
    if(q.t==='b'){nb++;if(ok){bo++;sc+=PTS.b}}else{ns++;if(ok){so++;sc+=PTS.s}}
    S.res[id]=ok?1:0;var it=S.items[id];
    if(!ok)S.items[id]={n:(it?it.n:0)+1,t:now,mine:pickText(q,q.t==='b'?(a||[]):(a||'')),memo:it?it.memo||'':'',done:false,re:0};
    else if(it){it.re=(it.re||0)+1;it.t=now}});
  var used=Math.min(now-M.start,M.limit>0?M.limit*60000:Infinity),total=nb*PTS.b+ns*PTS.s;
  M.res={sc:sc,total:total,bo:bo,nb:nb,so:so,ns:ns,used:used,auto:!!auto,per:per};M.phase='result';M.rf='all';
  (S.hist=S.hist||[]).push({t:now,sc:sc,total:total,bo:bo,nb:nb,so:so,ns:ns,used:used,limit:M.limit,set:M.set});S.hist=S.hist.slice(-30);
  save();mSave();updateCnt();if(V.tab==='mock'){renderMock();window.scrollTo(0,0)}}
function startHtml(){
  var h='<div class="mstart"><div class="card"><div class="qhead"><span class="qno">실전 모의고사</span></div>'+
   '<ul class="rules"><li><b>구성</b>: 박스형 15문항 × 2점 + 단답형 10문항 × 1점 = <b>40점</b> (중간고사 반영 비율과 같은 40점 만점)</li>'+
   '<li>고른 세트에서 강의 진도 순서대로, 파트별 비중을 맞춰 매번 새로 뽑아요. 상속은 사례형 위주로 8문항이 나와요.</li>'+
   '<li>박스형은 옳은 지문을 <b>모두</b> 골라야 정답이고 <b>부분점수는 없어요</b>. 단답형은 단어·수치를 직접 써요.</li>'+
   '<li>시험 중에는 정답이 보이지 않아요. 시간이 끝나면 자동으로 제출되고, 틀린 문제는 오답 노트로 들어가요.</li>'+
   '<li>단답형 배점은 강의에서 언급되지 않아 1점으로 정했어요.</li></ul>'+
   '<div class="tools" style="margin-top:14px"><span style="font-size:14px;font-weight:600">출제 범위</span>'+MSETS.map(function(s){return '<button class="chip" data-mset="'+s[0]+'" aria-pressed="'+(M.set===s[0])+'">'+s[1]+'</button>'}).join('')+'</div>'+
   '<div class="tools"><span style="font-size:14px;font-weight:600">제한 시간</span>'+[40,50,60,0].map(function(m){return '<button class="chip" data-mt="'+m+'" aria-pressed="'+(M.limit===m)+'">'+(m?m+'분':'제한 없음')+'</button>'}).join('')+'</div>'+
   '<div class="actions"><button class="btn" data-m="start">시험 시작</button></div></div>';
  var hs=(S.hist||[]).slice().reverse();
  h+='<div class="card"><div class="qhead"><span style="font-weight:700;color:var(--ink);font-size:15px">지난 응시 기록</span></div>';
  if(!hs.length)h+='<p style="margin:0;color:var(--muted)">아직 응시 기록이 없어요. 첫 모의고사를 보면 점수와 소요 시간이 여기에 쌓여요.</p>';
  else{var best=Math.max.apply(null,hs.map(function(x){return x.sc})),avg=hs.reduce(function(s,x){return s+x.sc},0)/hs.length;
    h+='<p style="margin:0 0 8px;font-size:14px">응시 '+hs.length+'회 · 최고 <b>'+best+'점</b> · 평균 '+avg.toFixed(1)+'점</p><div style="overflow-x:auto"><table class="hist"><tr><th>일시</th><th>범위</th><th>점수</th><th>박스형</th><th>단답형</th><th>소요</th></tr>'+
    hs.map(function(x){return '<tr><td>'+fmt(x.t)+'</td><td>'+setName(x.set||'A')+'</td><td><b>'+x.sc+'</b> / '+x.total+'</td><td>'+x.bo+'/'+x.nb+'</td><td>'+x.so+'/'+x.ns+'</td><td>'+Math.round(x.used/60000)+'분'+(x.limit?' / '+x.limit+'분':'')+'</td></tr>'}).join('')+'</table></div>';}
  return h+'</div></div>';
}
function resultHtml(){var r=M.res;
  var byPart={};M.qs.forEach(function(id){var q=byId(id),o=byPart[q.p]=byPart[q.p]||{n:0,ok:0,pt:0,max:0};o.n++;o.max+=PTS[q.t];if(r.per[id]){o.ok++;o.pt+=PTS[q.t]}});
  var wrong=M.qs.filter(function(id){return !r.per[id]}).length;
  var h='<div class="card"><div class="scorebox"><div class="scorebig">'+r.sc+'<small> / '+r.total+'점</small></div><div>'+
    '<div>박스형 <b>'+r.bo+'/'+r.nb+'</b> ('+r.bo*PTS.b+'점) · 단답형 <b>'+r.so+'/'+r.ns+'</b> ('+r.so*PTS.s+'점)</div>'+
    '<div style="color:var(--muted);font-size:14px">소요 '+Math.round(r.used/60000)+'분'+(M.limit?' / 제한 '+M.limit+'분':'')+(r.auto?' · 시간 종료로 자동 제출':'')+'</div>'+
    (wrong?'<div style="font-size:14px;margin-top:4px">틀린 <b>'+wrong+'문항</b>은 오답 노트에 기록했어요.</div>':'<div style="font-size:14px;margin-top:4px;color:var(--ok);font-weight:600">만점이에요!</div>')+'</div></div>'+
    '<div style="overflow-x:auto;margin-top:14px"><table class="hist"><tr><th>파트</th><th>맞힘</th><th>득점</th></tr>'+parts.slice(1).filter(function(p){return byPart[p]}).map(function(p){var o=byPart[p];return '<tr><td>'+p+'</td><td>'+o.ok+' / '+o.n+'</td><td>'+o.pt+' / '+o.max+'</td></tr>'}).join('')+'</table></div>'+
    '<div class="actions"><button class="btn" data-m="new">새 모의고사</button><button class="btn ghost" data-m="note">오답 노트 보기</button></div></div>';
  h+='<div class="tools" style="margin-top:18px"><span style="font-weight:700">문항별 채점</span><span class="spacer"></span><button class="chip" data-mr="all" aria-pressed="'+(M.rf==='all')+'">전체</button><button class="chip" data-mr="wrong" aria-pressed="'+(M.rf==='wrong')+'">틀린 문항만</button></div><div class="card" style="padding-top:4px">';
  M.qs.forEach(function(id,i){var q=byId(id),ok=r.per[id],a=M.ans[id];if(M.rf==='wrong'&&ok)return;
    h+='<div class="rv"><div class="top"><span class="ox '+(ok?'o':'x')+'">'+(ok?'O':'X')+'</span><b>'+(i+1)+'번</b><span class="tag">'+q.p+'</span>'+(q.hot?'<span class="hot">출제</span>':'')+'<span style="color:var(--muted);font-size:13px">'+PTS[q.t]+'점</span></div>'+
     '<div class="stem" style="margin:6px 0">'+q.stem+'</div>'+((q.sit||q.tr)?'<details><summary style="cursor:pointer;color:var(--accent);font-size:13.5px">상황 보기</summary>'+sitHtml(q)+'</details>':'');
    if(q.t==='b'){var pk=a||[];h+='<ol class="st">'+q.o.map(function(o,j){var isA=q.a.indexOf(j)>=0,on=pk.indexOf(j)>=0,m='';
      if(isA&&on)m='<span class="mk-ok">옳음 · 고름</span>';else if(isA)m='<span class="mk-no">옳음 · 놓침</span>';else if(on)m='<span class="mk-no">틀린 지문 · 고름</span>';
      return '<li><b>'+K[j]+'.</b><span>'+esc(o)+'</span>'+m+'</li>'}).join('')+'</ol>';}
    h+='<dl class="cmp"><dt>내 답</dt><dd class="'+(ok?'right':'mine')+'">'+esc(pickText(q,q.t==='b'?(a||[]):(a||'')))+'</dd><dt>정답</dt><dd class="right">'+ansText(q)+'</dd></dl><div class="exp">'+q.e+'</div></div>';});
  return h+'</div>';
}
function renderMock(){var el=document.getElementById('view-mock');document.body.classList.toggle('wide',M.phase==='exam');
  if(M.phase==='exam'){el.innerHTML=examHtml();mUpd();updTimer()}else if(M.phase==='result')el.innerHTML=resultHtml();else el.innerHTML=startHtml();}

function setTab(t){V.tab=t;['quiz','mock','note'].forEach(function(n){document.getElementById('tab-'+n).setAttribute('aria-selected',n===t);document.getElementById('view-'+n).hidden=n!==t});
  if(t!=='mock')document.body.classList.remove('wide');renderAll();}
function renderAll(){updateCnt();if(V.tab==='quiz'){renderChips();buildList();renderQ()}else if(V.tab==='mock')renderMock();else renderNote()}
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='tab-quiz')return setTab('quiz');
  if(b.id==='tab-mock')return setTab('mock');
  if(b.dataset.mt!==undefined){M.limit=+b.dataset.mt;mSave();return renderMock()}
  if(b.dataset.mset){M.set=b.dataset.mset;mSave();return renderMock()}
  if(b.dataset.set){V.set=b.dataset.set;V.part='전체';V.idx=0;V.single=null;return renderAll()}
  if(b.dataset.mo){var pr=b.dataset.mo.split('|'),id=pr[0],ix=+pr[1],arr=M.ans[id]=M.ans[id]||[],at=arr.indexOf(ix);if(at>=0)arr.splice(at,1);else arr.push(ix);b.setAttribute('aria-pressed',at<0);mSave();return mUpd()}
  if(b.dataset.mj!==undefined){var t=document.getElementById('mi-'+M.qs[+b.dataset.mj]);if(t)t.scrollIntoView({block:'start'});return}
  if(b.dataset.mr){M.rf=b.dataset.mr;mSave();return renderMock()}
  if(b.dataset.m){var a=b.dataset.m;
    if(a==='start')return startMock();
    if(a==='ask')return showConfirm();
    if(a==='cancel'){document.getElementById('mConfirm').hidden=true;return}
    if(a==='submit')return submitMock(false);
    if(a==='new'){M.phase='start';M.res=null;mSave();renderMock();return window.scrollTo(0,0)}
    if(a==='note'){V.nf='open';return setTab('note')}
  }
  if(b.id==='tab-note')return setTab('note');
  if(b.dataset.part){V.part=b.dataset.part;V.idx=0;V.single=null;return renderAll()}
  if(b.id==='onlyWrong'){V.onlyWrong=!V.onlyWrong;V.idx=0;V.single=null;return renderAll()}
  if(b.id==='shuffle'){V.shuffle=!V.shuffle;V.idx=0;return renderAll()}
  if(b.dataset.opt!==undefined){var q=byId(V.list[V.idx]),st=V.sess[q.id]=V.sess[q.id]||{pk:[]};if(st.g)return;var i=+b.dataset.opt,p=st.pk.indexOf(i);if(p>=0)st.pk.splice(p,1);else st.pk.push(i);return renderQ()}
  if(b.id==='grade')return grade();
  if(b.id==='retry'){delete V.sess[V.list[V.idx]];return renderQ()}
  if(b.id==='prev'){V.idx=Math.max(0,V.idx-1);renderQ();return scrollTop()}
  if(b.id==='next'){V.idx=Math.min(V.list.length-1,V.idx+1);renderQ();return scrollTop()}
  if(b.dataset.go!==undefined){V.idx=+b.dataset.go;renderQ();return scrollTop()}
  if(b.dataset.nf){V.nf=b.dataset.nf;return renderNote()}
  if(b.id==='retryWrong'){V.part='전체';V.onlyWrong=true;V.single=null;V.idx=0;openWrong().forEach(function(k){delete V.sess[k]});return setTab('quiz')}
  if(b.dataset.solo){var k=b.dataset.solo;V.single=null;V.part=byId(k).p;V.onlyWrong=false;delete V.sess[k];setTab('quiz');var ix=V.list.indexOf(k);V.idx=ix<0?0:ix;renderQ();return scrollTop()}
  if(b.dataset.done){var it=S.items[b.dataset.done];it.done=!it.done;it.t=Date.now();save();renderNote();return updateCnt()}
});
var memoT=null;
var mInT=null;
document.addEventListener('input',function(e){var ms=e.target.dataset&&e.target.dataset.ms;if(ms){M.ans[ms]=e.target.value;mUpd();clearTimeout(mInT);mInT=setTimeout(mSave,400);}});
document.addEventListener('input',function(e){var k=e.target.dataset&&e.target.dataset.memo;if(!k)return;S.items[k].memo=e.target.value;clearTimeout(memoT);memoT=setTimeout(save,600)});
function scrollTop(){var el=document.querySelector('.tabs');if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({block:'start'})}
if(M.phase==='exam'){setTab('mock');runTimer()}else renderAll();
</script>
